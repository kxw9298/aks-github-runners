<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 682" width="760" height="682" role="img" aria-label="Runners are fenced off from shared services and scale to zero when idle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Runners are fenced off from shared services and scale to zero when idle</title>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="760" height="682" fill="#ffffff"/>

  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">Runners are fenced off from shared services and scale to zero when idle</text>
  <text x="24" y="52" font-size="11.5" fill="#59636e">All calls to GitHub go outbound through the firewall; runner pods and org nodes exist only while jobs run</text>

  <!-- GitHub -->
  <rect x="24" y="76" width="144" height="502" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="96" y="100" text-anchor="middle" font-weight="600" fill="#1f2328">GitHub (GHEC)</text>
  <text x="96" y="490" text-anchor="middle" font-size="11.5" fill="#59636e">+ more orgs</text>

  <rect x="36" y="250" width="120" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="96" y="274" text-anchor="middle" font-weight="600" fill="#1f2328">Org A</text>
  <text x="96" y="290" text-anchor="middle" font-size="11.5" fill="#59636e">GitHub App A</text>
  <text x="96" y="306" text-anchor="middle" font-size="11.5" fill="#59636e">runner group A</text>

  <rect x="36" y="386" width="120" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="96" y="410" text-anchor="middle" font-weight="600" fill="#1f2328">Org B</text>
  <text x="96" y="426" text-anchor="middle" font-size="11.5" fill="#59636e">GitHub App B</text>
  <text x="96" y="442" text-anchor="middle" font-size="11.5" fill="#59636e">runner group B</text>

  <!-- Firewall -->
  <rect x="184" y="76" width="28" height="502" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="198" y="327" transform="rotate(-90 198 327)" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Azure Firewall · egress allowlist</text>

  <!-- Shared AKS cluster -->
  <rect x="228" y="76" width="508" height="502" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="244" y="100" font-weight="600" fill="#1f2328">Shared enterprise AKS cluster · private · Azure Linux 3</text>

  <rect x="244" y="112" width="476" height="56" rx="8" fill="#eef0f2" stroke="#8c959f" stroke-width="1.25"/>
  <text x="260" y="136" font-weight="600" fill="#1f2328">System node pool · always on</text>
  <text x="260" y="152" font-size="11.5" fill="#59636e">ARC controller · one listener per scale set · Kyverno · CoreDNS · Cilium</text>

  <!-- Runner subnet -->
  <rect x="244" y="184" width="476" height="306" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="260" y="206" font-weight="600" fill="#1f2328">Runner subnet · NSG blocks the shared services</text>

  <!-- Org A lane -->
  <rect x="256" y="218" width="452" height="120" rx="8" fill="none" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="268" y="240" font-weight="600" fill="#1f2328">Org A boundary · namespace arc-org-a</text>
  <rect x="268" y="250" width="108" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="322" y="274" text-anchor="middle" font-weight="600" fill="#1f2328">Scale sets</text>
  <text x="322" y="290" text-anchor="middle" font-size="11.5" fill="#59636e">linux, docker</text>
  <rect x="392" y="250" width="160" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="472" y="274" text-anchor="middle" font-weight="600" fill="#1f2328">Runner pods</text>
  <text x="472" y="290" text-anchor="middle" font-size="11.5" fill="#59636e">1 pod per job</text>
  <text x="472" y="306" text-anchor="middle" font-size="11.5" fill="#59636e">Docker jobs: Kata VM</text>
  <rect x="568" y="250" width="128" height="72" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/>
  <text x="632" y="274" text-anchor="middle" font-weight="600" fill="#1f2328">Org A nodes</text>
  <text x="632" y="290" text-anchor="middle" font-size="11.5" fill="#1f2328">tainted, 0 to N</text>

  <!-- Org B lane -->
  <rect x="256" y="354" width="452" height="120" rx="8" fill="none" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="268" y="376" font-weight="600" fill="#1f2328">Org B boundary · namespace arc-org-b</text>
  <rect x="268" y="386" width="108" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="322" y="410" text-anchor="middle" font-weight="600" fill="#1f2328">Scale sets</text>
  <text x="322" y="426" text-anchor="middle" font-size="11.5" fill="#59636e">linux, docker</text>
  <rect x="392" y="386" width="160" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="472" y="410" text-anchor="middle" font-weight="600" fill="#1f2328">Runner pods</text>
  <text x="472" y="426" text-anchor="middle" font-size="11.5" fill="#59636e">1 pod per job</text>
  <text x="472" y="442" text-anchor="middle" font-size="11.5" fill="#59636e">Docker jobs: Kata VM</text>
  <rect x="568" y="386" width="128" height="72" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/>
  <text x="632" y="410" text-anchor="middle" font-weight="600" fill="#1f2328">Org B nodes</text>
  <text x="632" y="426" text-anchor="middle" font-size="11.5" fill="#1f2328">tainted, 0 to N</text>

  <!-- Shared services -->
  <rect x="244" y="506" width="476" height="56" rx="8" fill="#eef0f2" stroke="#8c959f" stroke-width="1.25"/>
  <text x="260" y="530" font-weight="600" fill="#1f2328">Shared services node pools · own subnet</text>
  <text x="260" y="546" font-size="11.5" fill="#59636e">Tainted against runner pods · no network route from the runner subnet</text>

  <!-- Connectors -->
  <g fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arch-arrow)">
    <path d="M376 286H392"/>
    <path d="M552 286H568"/>
    <path d="M376 422H392"/>
    <path d="M552 422H568"/>
    <path d="M256 286H212"/>
    <path d="M184 286H156"/>
    <path d="M256 422H212"/>
    <path d="M184 422H156"/>
    <path d="M244 140H212"/>
    <path d="M184 140H168"/>
    <path d="M306 602V578"/>
    <path d="M482 602V578"/>
    <path d="M658 578V602"/>
  </g>
  <text x="314" y="594" font-size="11.5" fill="#59636e">image pull</text>
  <text x="490" y="594" font-size="11.5" fill="#59636e">key sync</text>
  <text x="666" y="594" font-size="11.5" fill="#59636e">telemetry</text>

  <!-- Shared Azure services -->
  <rect x="228" y="602" width="156" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="306" y="626" text-anchor="middle" font-weight="600" fill="#1f2328">ACR</text>
  <text x="306" y="642" text-anchor="middle" font-size="11.5" fill="#59636e">signed golden image</text>
  <rect x="404" y="602" width="156" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="482" y="626" text-anchor="middle" font-weight="600" fill="#1f2328">Key Vault per org</text>
  <text x="482" y="642" text-anchor="middle" font-size="11.5" fill="#59636e">GitHub App keys</text>
  <rect x="580" y="602" width="156" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="658" y="626" text-anchor="middle" font-weight="600" fill="#1f2328">Azure Monitor</text>
  <text x="658" y="642" text-anchor="middle" font-size="11.5" fill="#59636e">Prometheus + logs</text>

  <!-- Key -->
  <rect x="24" y="608" width="14" height="14" rx="3" fill="#eef0f2" stroke="#8c959f" stroke-width="1"/>
  <text x="46" y="619" font-size="11.5" fill="#59636e">always on</text>
  <rect x="24" y="636" width="14" height="14" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/>
  <text x="46" y="647" font-size="11.5" fill="#59636e">dedicated VMs, 0 when idle</text>
</svg>
