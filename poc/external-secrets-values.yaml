installCRDs: true
scopedNamespace: arc-runners
scopedRBAC: true
processClusterExternalSecret: false
processClusterStore: false
processClusterGenerator: false
processClusterPushSecret: false
processPushSecret: false
nodeSelector:
  kubernetes.azure.com/agentpool: system
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
webhook:
  nodeSelector:
    kubernetes.azure.com/agentpool: system
certController:
  nodeSelector:
    kubernetes.azure.com/agentpool: system
