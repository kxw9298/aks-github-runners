apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyvault-reader
  annotations:
    azure.workload.identity/client-id: {{ required "clientId is required" .Values.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "tenantId is required" .Values.tenantId | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-app-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "vaultUrl is required" .Values.vaultUrl | quote }}
      serviceAccountRef:
        name: keyvault-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: github-app-keyvault
  target:
    name: github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.secretName | quote }}
