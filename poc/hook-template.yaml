apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-hook-template
  namespace: arc-runners
data:
  hook-template.yaml: |
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.azure.com/agentpool: system
      containers:
        - name: "$job"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
